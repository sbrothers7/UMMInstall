name: Release GUI (v2)

# Builds the Flutter app and attaches it to the GitHub release as
# ADOFAIModInstaller-macos.zip and ADOFAIModInstaller-linux.tar.gz, the names
# the updaters look for (GithubRelease.guiAsset).
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # The first attach creates the release; two at once can race.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      # The updaters compare appVersion with the tag; a mismatch re-offers
      # the same release forever.
      - name: Check appVersion matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: grep -qx "const appVersion = '${GITHUB_REF_NAME#v}';" core/lib/src/version.dart

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - run: flutter config --enable-${{ matrix.platform }}-desktop
      - run: flutter pub get
      - run: dart pub get && dart test
        working-directory: core
      - run: flutter build ${{ matrix.platform }} --release

      - name: Package macOS
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent "build/macos/Build/Products/Release/adofai_mod_installer.app" "ADOFAIModInstaller-macos.zip"

      # tar keeps the executable bit; the bundle unpacks as one folder.
      - name: Package Linux
        if: matrix.platform == 'linux'
        run: tar -czf ADOFAIModInstaller-linux.tar.gz -C build/linux/x64/release --transform 's,^bundle,adofai-mod-installer,' bundle

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gui/ADOFAIModInstaller-*

  cli:
    # The GUI job creates the release; attaching in parallel races it.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get && dart test
        working-directory: core
      - run: dart pub get && dart test
      - run: dart compile exe bin/amm.dart -o amm-${{ matrix.target }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cli/amm-*
