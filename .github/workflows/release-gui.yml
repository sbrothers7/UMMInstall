name: Release GUI (v2)

# Builds the Flutter app and attaches it to the GitHub release as
# Installer-macos.zip and Installer-linux.tar.gz, the names
# the updaters look for (GithubRelease.guiAsset).
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # The first attach may create the release; two at once can race.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      # The updaters compare appVersion with the tag; a mismatch re-offers
      # the same release forever.
      - name: Check appVersion matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: grep -qx "const appVersion = '${GITHUB_REF_NAME#v}';" core/lib/src/version.dart

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - run: flutter config --enable-${{ matrix.platform }}-desktop
      - run: flutter pub get
      - run: dart pub get && dart test
        working-directory: core
      - run: flutter build ${{ matrix.platform }} --release

      - name: Package macOS
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent "build/macos/Build/Products/Release/adofai_mod_installer.app" "Installer-macos.zip"

      # tar keeps the executable bit; the bundle unpacks as one folder.
      - name: Package Linux
        if: matrix.platform == 'linux'
        run: tar -czf Installer-linux.tar.gz -C build/linux/x64/release --transform 's,^bundle,adofai-mod-installer,' bundle

      # Uploads into the draft release.sh made, or a new draft when the tag
      # was pushed by hand. Publishing is left to a person.
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" Installer-* --clobber

  cli:
    # The GUI job makes sure the release exists before these upload.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get && dart test
        working-directory: core
      - run: dart pub get && dart test
      - run: dart compile exe bin/amm.dart -o amm-${{ matrix.target }}

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" amm-* --clobber
