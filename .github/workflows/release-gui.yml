name: Release GUI (v2)

# Builds the Flutter app and attaches a platform-named zip to the GitHub
# release. macOS only for now; Windows/Linux are added back to the matrix when
# those platforms are supported (the updater selects by platform keyword).
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-${{ matrix.platform }}-desktop
      - run: flutter pub get
      - run: flutter build ${{ matrix.platform }} --release

      - name: Package macOS
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent "build/macos/Build/Products/Release/adofai_mod_installer.app" "ADOFAIModInstaller-macos.zip"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gui/ADOFAIModInstaller-*.zip
